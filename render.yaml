services:
  # Backend Web Service
  - type: web
    name: emp-app-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: emp-app-frontend
          type: web
          property: url

  # Frontend Static Site (Defined as type: web with runtime: static)
  - type: web
    name: emp-app-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: emp-app-backend
          type: web
          property: url
