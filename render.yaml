services:
  # Backend Web Service
  - type: web
    name: emp-app-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_URL
        sync: false
      - key: FRONTEND_URL
        sync: false # Set this to your Frontend URL after deployment

  # Frontend Static Site
  - type: web
    name: emp-app-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to your Backend URL after deployment
